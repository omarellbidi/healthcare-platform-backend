# Application Name
spring.application.name=HealthServicesApp

# Server Configuration
server.port=8080
server.forward-headers-strategy=framework

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/healthapp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration (512-bit secret required for HS512)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Email Configuration - SendGrid API
sendgrid.api.key=${SENDGRID_API_KEY:}
app.email.from=${EMAIL_FROM:health.services.platform@gmail.com}

# Initial admin account (no admin is created if these are not set)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Frontend URLs (use environment variables for production)
app.frontend.patient.url=${PATIENT_FRONTEND_URL:http://localhost:3000}
app.frontend.doctor.url=${DOCTOR_FRONTEND_URL:http://localhost:3001}

# Logging
logging.level.com.healthapp.backend=${LOG_LEVEL:INFO}